<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | My Portfolio</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0786a3;
  color: #222;
}

/* Navigation Bar */
header {
  background: #070b19;
  padding: 18px;
  text-align: center;
}

.logo {
  display: block;
  color: #24a8ff;
  font-size: 27px;
  font-weight: bold;
  text-decoration: none;
  margin-bottom: 18px;
}

.logo span {
  color: #8b5cf6;
}

nav {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

nav a {
  color: #aab5cc;
  text-decoration: none;
  font-size: 16px;
}

nav a:hover {
  color: white;
}

/* Login Box */
.login {
  background: white;
  width: 90%;
  max-width: 550px;
  margin: 60px auto;
  padding: 45px;
  border-radius: 15px;
}

h1 {
  text-align: center;
  color: #555;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 18px;
  font-size: 17px;
}

input {
  width: 100%;
  padding: 16px;
  margin-top: 7px;
  border: 1px solid #ddd;
  font-size: 16px;
}

.show {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0;
}

.show input {
  width: auto;
  margin: 0;
}

.show label {
  margin: 0;
}

button {
  width: 100%;
  padding: 18px;
  background: #007797;
  color: white;
  border: none;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #005d78;
}

.links {
  text-align: center;
  margin-top: 30px;
  line-height: 2;
}

.links a {
  color: #007797;
  text-decoration: none;
}

@media(max-width: 600px) {
  nav {
    gap: 15px;
  }

  nav a {
    font-size: 14px;
  }

  .login {
    padding: 30px 22px;
    margin: 35px auto;
  }
}
</style>
</head>

<body>

<!-- Navigation Bar -->
<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="skills.html">Skills</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- Login Form -->
<div class="login">

  <h1>Login</h1>

  <form>

    <label>Email:</label>
    <input type="email" placeholder="Enter email" required>

    <label>Password:</label>
    <input type="password" id="password"
    placeholder="Enter password" required>

    <div class="show">
      <input type="checkbox" id="show">
      <label for="show">Show Password</label>
    </div>

    <button type="submit">SIGN IN</button>

  </form>

  <div class="links">
    <a href="#">Forgot Username / Password?</a>
    <p>Don't have an account?
      <a href="register.html">Sign up</a>
    </p>
  </div>

</div>

<script>
document.getElementById("show").onclick = function() {
  document.getElementById("password").type =
  this.checked ? "text" : "password";
};
</script>

</body>
</html>
