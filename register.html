<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #ffe8e5;
  color: #222;
}

/* Navigation Bar */
header {
  background: #070b19;
  padding: 18px;
  text-align: center;
}

.logo {
  display: block;
  color: #24a8ff;
  font-size: 27px;
  font-weight: bold;
  text-decoration: none;
  margin-bottom: 18px;
}

.logo span {
  color: #8b5cf6;
}

nav {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

nav a {
  color: #aab5cc;
  text-decoration: none;
  font-size: 16px;
}

nav a:hover {
  color: white;
}

/* Registration Form */
.form {
  max-width: 850px;
  margin: 35px auto;
  padding: 25px;
}

h1 {
  text-align: center;
  margin-bottom: 40px;
  font-size: 35px;
}

.row {
  display: grid;
  grid-template-columns: 220px 1fr;
  align-items: center;
  gap: 15px;
  margin: 20px 0;
}

label {
  font-size: 17px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #aaa;
  background: white;
  font-size: 15px;
}

.name, .mobile, .dob {
  display: flex;
  align-items: center;
  gap: 10px;
}

.gender, .department {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.gender input,
.department input {
  width: auto;
}

.photo input {
  border: none;
  background: transparent;
}

textarea {
  height: 100px;
  resize: vertical;
}

button {
  display: block;
  margin: 30px auto;
  padding: 13px 35px;
  cursor: pointer;
  background: #007797;
  color: white;
  border: none;
  font-size: 16px;
}

button:hover {
  background: #005d78;
}

/* Mobile Responsive */
@media(max-width: 600px) {
  nav {
    gap: 15px;
  }

  nav a {
    font-size: 14px;
  }

  .form {
    padding: 15px;
  }

  h1 {
    font-size: 27px;
  }

  .row {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .name, .mobile, .dob {
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>

<!-- Navigation Bar -->
<header>
  

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="skills.html">Skills</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- Registration Form -->
<div class="form">

<h1>Student Registration Form</h1>

<form>

  <div class="row">
    <label>Roll no. :</label>
    <input type="text" required>
  </div>

  <div class="row">
    <label>Student name :</label>
    <div class="name">
      <input type="text" placeholder="First Name" required>
      <input type="text" placeholder="Last Name" required>
    </div>
  </div>

  <div class="row">
    <label>Father's name :</label>
    <input type="text" required>
  </div>

  <div class="row">
    <label>Date of birth :</label>
    <input type="date" required>
  </div>

  <div class="row">
    <label>Mobile no. :</label>
    <div class="mobile">
      <input type="text" value="+91" readonly style="width:70px">
      <input type="tel" placeholder="Mobile Number" required>
    </div>
  </div>

  <div class="row">
    <label>Email id :</label>
    <input type="email" required>
  </div>

  <div class="row">
    <label>Password :</label>
    <input type="password" required>
  </div>

  <div class="row">
    <label>Gender :</label>
    <div class="gender">
      <input type="radio" name="gender" required> Male
      <input type="radio" name="gender"> Female
    </div>
  </div>

  <div class="row">
    <label>Department :</label>
    <div class="department">
      <input type="checkbox"> CSE
      <input type="checkbox"> IT
      <input type="checkbox"> ECE
      <input type="checkbox"> Civil
      <input type="checkbox"> Mech
    </div>
  </div>

  <div class="row">
    <label>Course :</label>
    <select required>
      <option value="">Select Current Course</option>
      <option>BCA</option>
      <option>B.Tech</option>
      <option>MCA</option>
      <option>MDCE</option>
      <option>MBA</option>
    </select>
  </div>

  <div class="row">
    <label>Student photo :</label>
    <div class="photo">
      <input type="file" accept="image/*">
    </div>
  </div>

  <div class="row">
    <label>City :</label>
    <input type="text" required>
  </div>

  <div class="row">
    <label>Address :</label>
    <textarea required></textarea>
  </div>

  <button type="submit">Register</button>

</form>
</div>

</body>
</html>
