
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffe8e5;
      padding: 30px;
    }

    .form {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 38px;
    }

    .row {
      display: grid;
      grid-template-columns: 250px 1fr;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }

    label {
      font-size: 18px;
    }

    input, select, textarea {
      padding: 10px;
      border: 1px solid #aaa;
      background: white;
      font-size: 15px;
      width: 100%;
    }

    .name, .dob, .mobile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gender, .department {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .gender input,
    .department input {
      width: auto;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    .photo input {
      border: none;
      background: transparent;
    }

    button {
      display: block;
      margin: 35px auto;
      padding: 12px 30px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      h1 {
        font-size: 28px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .name, .dob, .mobile {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <div class="form">

    <h1>Student Registration Form</h1>

    <form>

      <div class="row">
        <label>Roll no. :</label>
        <input type="text" name="roll" required>
      </div>

      <div class="row">
        <label>Student name :</label>
        <div class="name">
          <input type="text" placeholder="First Name" required>
          -
          <input type="text" placeholder="Last Name" required>
        </div>
      </div>

      <div class="row">
        <label>Father's name :</label>
        <input type="text" required>
      </div>

      <div class="row">
        <label>Date of birth :</label>
        <input type="date" required>
      </div>

      <div class="row">
        <label>Mobile no. :</label>
        <div class="mobile">
          <input type="text" value="+91" style="width:65px" readonly>
          <input type="tel" placeholder="Mobile Number" required>
        </div>
      </div>

      <div class="row">
        <label>Email id :</label>
        <input type="email" required>
      </div>

      <div class="row">
        <label>Password :</label>
        <input type="password" required>
      </div>

      <div class="row">
        <label>Gender :</label>
        <div class="gender">
          <input type="radio" name="gender" value="Male" required> Male
          <input type="radio" name="gender" value="Female"> Female
        </div>
      </div>

      <div class="row">
        <label>Department :</label>
        <div class="department">
          <input type="checkbox" value="CSE"> CSE
          <input type="checkbox" value="IT"> IT
          <input type="checkbox" value="ECE"> ECE
          <input type="checkbox" value="Civil"> Civil
          <input type="checkbox" value="Mech"> Mech
        </div>
      </div>

      <div class="row">
        <label>Course :</label>
        <select required>
          <option value="">Select Current Course</option>
          <option>BCA</option>
          <option>B.Tech</option>
          <option>MCA</option>
          <option>MDCE</option>
          <option>MBA</option>
        </select>
      </div>

      <div class="row">
        <label>Student photo :</label>
        <div class="photo">
          <input type="file" accept="image/*">
        </div>
      </div>

      <div class="row">
        <label>City :</label>
        <input type="text" required>
      </div>

      <div class="row">
        <label>Address :</label>
        <textarea required></textarea>
      </div>

      <button type="submit">Register</button>

    </form>

  </div>

</body>
</html>
