<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | My Portfolio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:#f4f7ff;
  line-height:1.6;
}

/* Navigation Bar */
header{
  background:#070b19;
  border-bottom:1px solid #263047;
}

.nav{
  max-width:1100px;
  margin:auto;
  padding:20px;
  text-align:center;
}

.logo{
  display:block;
  font-size:27px;
  font-weight:bold;
  color:#24a8ff;
  margin-bottom:18px;
  text-decoration:none;
}

nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:25px;
}

nav a{
  color:#aab5cc;
  text-decoration:none;
  font-size:16px;
}

nav a:hover,nav a.active{
  color:white;
  border-bottom:2px solid #24a8ff;
}

/* Gallery Section */
.container{
  max-width:1100px;
  margin:auto;
  padding:60px 20px;
}

.eyebrow{
  color:#24a8ff;
  letter-spacing:2px;
  font-size:13px;
  font-weight:bold;
}

h1{
  font-size:45px;
  margin:10px 0;
}

.highlight{
  color:#8b5cf6;
}

p{
  color:#aab5cc;
  margin:10px 0;
}

/* Gallery Grid */
.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:30px;
}

.gallery img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:15px;
  border:2px solid #263047;
  transition:0.3s;
}

.gallery img:hover{
  transform:scale(1.04);
  border-color:#24a8ff;
}

/* Footer */
footer{
  text-align:center;
  padding:25px;
  color:#aab5cc;
  border-top:1px solid #263047;
}

/* Mobile Responsive */
@media(max-width:700px){
  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .gallery img{
    height:160px;
  }

  h1{font-size:35px}
  nav{gap:15px}
  .container{padding:45px 15px}
}

@media(max-width:400px){
  .gallery{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="projects.html">Projects</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>

  </div>
</header>

<main class="container">

  <div class="eyebrow">MY MEMORIES</div>

  <h1>My <span class="highlight">Gallery</span></h1>

  <p>Welcome to my photo gallery. Here are some of my favourite pictures and memories.</p>

  <div class="gallery">

    <img src="image1.jpg" alt="Gallery Photo 1">
    <img src="image2.jpg" alt="Gallery Photo 2">
    <img src="image3.jpg" alt="Gallery Photo 3">
    <img src="image4.jpg" alt="Gallery Photo 4">
    <img src="image5.jpg" alt="Gallery Photo 5">
    <img src="image6.jpg" alt="Gallery Photo 6">

  </div>

</main>

<footer>
  © 2026 MOHAMMAD ARQAM. Made with HTML & CSS.
</footer>

</body>
</html>
